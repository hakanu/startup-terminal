name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows GUI Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: |
          uv venv --python 3.12
          uv pip install PySide6 psutil PyYAML pyinstaller

      - name: Build Windows GUI exe (no console)
        run: |
          .\.venv\Scripts\pyinstaller.exe `
            --noconfirm `
            --onefile `
            --windowed `
            --name startup-terminal-windows-x64 `
            --icon assets/startup_terminal.ico `
            --add-data "assets;assets" `
            --collect-submodules ui `
            --hidden-import service_runner `
            main.py

      - name: Package Windows zip
        run: |
          Compress-Archive -Path dist/startup-terminal-windows-x64.exe -DestinationPath dist/startup-terminal-windows-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/startup-terminal-windows-x64.exe
            dist/startup-terminal-windows-x64.zip

  build-python-dist:
    name: Build Python Wheel & Sdist (uv / pip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-python-dist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
